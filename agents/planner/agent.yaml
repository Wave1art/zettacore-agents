key: planner
version: 1.0.0
requires_engine: ">=2.0.0-rc.58"
description: Plans one item through its planning item (Zettacore ADR 0055) — a feature into tracer-bullet phases and its workspace, an initiative into decisions and features, a task or a bug into what it needs — and ends with a plan summary for a person to accept or send back. Writes items and item inputs in the engine, never code.
runtime: opencode
profile: planner
model: {tier: frontier}
states:
  - name: survey
    prompt: prompts/survey.md
    time_budget: 15m
    idle_timeout: 10m
    max_attempts: 2
  - name: plan
    prompt: prompts/plan.md
    time_budget: 40m
    idle_timeout: 15m
    max_attempts: 2
  - name: check
    prompt: prompts/check.md
    time_budget: 15m
    idle_timeout: 10m
    max_attempts: 2
remediation: false
skills: [work-types, spec-to-tickets, scope-initiative, plan-task-or-bug, workspace, readiness-check, plan-summary]
permissions: {bash: {"*": allow, "rm -rf *": deny}, edit: deny, external_directory: allow, webfetch: deny, websearch: deny}
sandbox: {cpu: "1", memory: 2Gi, dockerd: false}
timeouts: {idle: 15m, gate: 10m, bootstrap: 2m}
