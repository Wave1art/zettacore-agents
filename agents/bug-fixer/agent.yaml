key: bug-fixer
version: 2.4.1
requires_engine: ">=2.0.0-rc.63"
description: Diagnoses one defect from its brief and repro, fixes the cause with a regression test, gated on the pinned contract.
runtime: opencode
profile: coder
model: {tier: standard}
states:
  - name: implement
    prompt: prompts/implement.md
    time_budget: 60m
    idle_timeout: 20m
    max_attempts: 2
    checks:
      - {kind: command, command: [sh, -c, 'command -v zc-verify >/dev/null && exec zc-verify || exec bash .zcore/verify.sh'], env: {ZC_TIER: fast}, timeout: 900}
      - {kind: predicate, name: tier0_denies}
remediation: true
permissions: {bash: {"*": allow, "rm -rf *": deny}, external_directory: allow}
sandbox: {cpu: "1", memory: 2Gi, dockerd: true}
timeouts: {idle: 20m, gate: 10m, bootstrap: 2m}
