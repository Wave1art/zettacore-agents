key: bug-fixer
version: 2.0.3
description: Diagnoses one defect from its brief and repro, fixes the cause with a regression test, gated on the pinned contract.
runtime: opencode
profile: coder
model: {tier: standard, fallback_tier: cheap}
states:
  - name: implement
    prompt: prompts/implement.md
    time_budget: 60m
    idle_timeout: 20m
    max_attempts: 2
remediation: true
skills: [implement]
permissions: {bash: {"*": allow, "rm -rf *": deny}, external_directory: allow}
sandbox: {cpu: "1", memory: 2Gi, dockerd: true}
timeouts: {idle: 20m, gate: 10m, bootstrap: 2m}
