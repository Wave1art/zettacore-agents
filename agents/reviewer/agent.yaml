key: reviewer
version: 3.1.0
requires_engine: ">=2.0.0-rc.49"
description: Reviews a change as an agent in its own environment (Zettacore ADR 0051), spec then standards in one sandbox, and ends each axis with end_step carrying its verdict, which the workflow records.
runtime: opencode
profile: reviewer
model: {tier: frontier}
states:
  - name: spec
    prompt: prompts/spec.md
    time_budget: 45m
    idle_timeout: 10m
    max_attempts: 1
  - name: standards
    prompt: prompts/standards.md
    time_budget: 45m
    idle_timeout: 10m
    max_attempts: 1
remediation: false
permissions: {bash: {"*": allow, "rm -rf *": deny}, external_directory: allow, webfetch: deny, websearch: deny}
sandbox: {cpu: "2", memory: 4Gi, dockerd: true}
timeouts: {idle: 10m, gate: 10m, bootstrap: 5m}
