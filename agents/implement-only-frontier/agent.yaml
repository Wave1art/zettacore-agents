key: implement-only-frontier
version: 1.3.0
requires_engine: ">=2.0.0-rc.12"
description: implement-only kept under its older key for existing bindings; runs on the standard tier like implement-only. One implement pass per iteration, gated on the pinned contract.
runtime: opencode
profile: coder
model: {tier: standard, fallback_tier: cheap}
states:
  - name: implement
    prompt: prompts/implement.md
    time_budget: 60m
    idle_timeout: 20m
    max_attempts: 2
remediation: true
skills: [implement]
permissions: {bash: {"*": allow, "rm -rf *": deny}, external_directory: allow}
sandbox: {cpu: "1", memory: 2Gi, dockerd: true}
timeouts: {idle: 20m, gate: 10m, bootstrap: 2m}
