key: coding-worker
version: 2.4.0
requires_engine: ">=2.0.0-rc.63"
description: Implements one phase of a feature through the five-state loop, gated on the pinned contract.
runtime: opencode
profile: coder
model: {tier: standard}
states:
  - name: resolve
    prompt: prompts/resolve.md
    time_budget: 10m
    idle_timeout: 5m
    max_attempts: 2
  - name: implement
    prompt: prompts/implement.md
    time_budget: 45m
    idle_timeout: 20m
    max_attempts: 3
    checks:
      - {kind: predicate, name: checklist_exists}
      - {kind: command, command: [sh, -c, 'command -v zc-verify >/dev/null && exec zc-verify || exec bash .zcore/verify.sh'], env: {ZC_TIER: fast}, timeout: 600}
      - {kind: predicate, name: tier0_denies}
  - name: verify
    prompt: prompts/verify.md
    time_budget: 20m
    idle_timeout: 10m
    max_attempts: 2
    checks:
      - {kind: command, command: [sh, -c, 'command -v zc-verify >/dev/null && exec zc-verify || exec bash .zcore/verify.sh'], env: {ZC_TIER: fast}, timeout: 900}
      - {kind: predicate, name: tier0_denies}
  - name: review
    prompt: prompts/review.md
    time_budget: 15m
    idle_timeout: 10m
    max_attempts: 2
  - name: handoff
    prompt: prompts/handoff.md
    time_budget: 10m
    idle_timeout: 5m
    max_attempts: 2
    checks:
      - {kind: checklist}
remediation: true
permissions: {bash: {"*": allow, "rm -rf *": deny}, external_directory: allow}
sandbox: {cpu: "1", memory: 2Gi, dockerd: true}
timeouts: {idle: 20m, gate: 10m, bootstrap: 2m}
