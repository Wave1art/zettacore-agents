key: implement-only
version: 2.2.1
requires_engine: ">=2.0.0-rc.27"
description: Single-state variant of coding-worker; one implement pass per iteration, gated on the pinned contract.
runtime: opencode
profile: coder
model: {tier: standard}
states:
  - name: implement
    prompt: prompts/implement.md
    time_budget: 60m
    idle_timeout: 20m
    max_attempts: 2
remediation: true
permissions: {bash: {"*": allow, "rm -rf *": deny}, external_directory: allow}
sandbox: {cpu: "1", memory: 2Gi, dockerd: true}
timeouts: {idle: 20m, gate: 10m, bootstrap: 2m}
