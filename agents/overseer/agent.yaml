key: overseer
version: 2.1.0
requires_engine: ">=2.0.0-rc.27"
description: Diagnoses a shift that stopped at an exit state and relaunches or repairs it within its authorities, else escalates to the inbox.
runtime: llm-loop
profile: gate
model: {tier: standard}
states:
  - name: diagnose
    prompt: prompts/diagnose.md
    time_budget: 10m
    idle_timeout: 5m
    max_attempts: 1
  - name: repair
    prompt: prompts/repair.md
    time_budget: 10m
    idle_timeout: 5m
    max_attempts: 1
remediation: false
sandbox: {cpu: "1", memory: 1Gi, dockerd: false}
timeouts: {idle: 10m, gate: 10m, bootstrap: 1m, decision: 24h}
